# Re-imports a public-domain Bible from ebible.org and opens a pull request with the new data.
# Run it from the Actions tab: "Import Bible text" → Run workflow → choose a version.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Import Bible text
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to import
        required: true
        default: bsb
        type: choice
        options: [bsb, web, kjv, asv, ylt]
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import -- ${{ inputs.version }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: import/${{ inputs.version }}
          title: "Import ${{ inputs.version }} from ebible.org"
          commit-message: "Import ${{ inputs.version }} from ebible.org"
          body: Automated import of `${{ inputs.version }}` from ebible.org via `npm run import`.
